services:
  - type: web
    name: veeras-beauty-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: GPAY_UPI_ID
        sync: false
      - key: BUSINESS_NAME
        value: Veera's Beauty & Tattoo Studio
      - key: WHATSAPP_NUMBER
        value: "918344549199"
      - key: PHONE_NUMBER
        value: "+918344549199"
      - key: ALLOWED_ORIGINS
        sync: false
